<div class="admin-page">
  <div class="admin-page__header">
    <h1 class="admin-page__title">
      {{ "admin.title" | translate }}
    </h1>

    <app-admin-filters
      [search]="adminService.searchQuery()"
      (searchChange)="adminService.setSearch($event)"
      [sort]="adminService.sortCriteria()"
      (sortChange)="adminService.setSort($event)"
      [availability]="adminService.dishAvailability()"
      (availabilityChange)="adminService.setAvailabilityFilter($event)"
      [lang]="languageService.lang()"
    />

    <button type="button" pButton (click)="onLogout()">
      {{ "auth.logout" | translate }}
    </button>
  </div>

  <div class="admin-page__items"></div>
</div>
